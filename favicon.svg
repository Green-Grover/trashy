<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" aria-label="Trashy logo: a lopsided green bin with one googly eye, its tongue out and a glowing chip on a spring antenna">
  <!-- spring antenna with a glowing chip (the "LLM brain") -->
  <path d="M150 58 q10 -6 0 -12 q-10 -6 0 -12 q10 -6 0 -12" fill="none" stroke="#14231C" stroke-width="5" stroke-linecap="round"/>
  <circle cx="150" cy="18" r="16" fill="#FFD23F" opacity="0.35"/>
  <rect x="139" y="7" width="22" height="22" rx="4" fill="#FFD23F" stroke="#14231C" stroke-width="4"/>
  <path d="M144 12 h12 M144 18 h12 M144 24 h12" stroke="#14231C" stroke-width="2.5"/>
  <!-- lid, knocked askew -->
  <g transform="rotate(-14 128 70)">
    <rect x="52" y="58" width="152" height="22" rx="8" fill="#1E7A4C" stroke="#14231C" stroke-width="6"/>
    <rect x="110" y="44" width="36" height="16" rx="6" fill="#1E7A4C" stroke="#14231C" stroke-width="6"/>
  </g>
  <!-- body, slightly wonky -->
  <path d="M64 92 L196 86 L180 232 Q178 242 168 242 L90 242 Q80 242 78 232 Z" fill="#2FA36B" stroke="#14231C" stroke-width="6" stroke-linejoin="round"/>
  <path d="M104 118 L108 222 M132 116 L132 222 M160 114 L156 222" stroke="#1E7A4C" stroke-width="6" stroke-linecap="round"/>
  <!-- one big googly eye, one tiny one -->
  <circle cx="104" cy="140" r="30" fill="#FBFBF5" stroke="#14231C" stroke-width="6"/>
  <circle cx="114" cy="152" r="13" fill="#14231C"/>
  <circle cx="110" cy="147" r="4" fill="#FBFBF5"/>
  <circle cx="160" cy="136" r="12" fill="#FBFBF5" stroke="#14231C" stroke-width="5"/>
  <circle cx="157" cy="131" r="5" fill="#14231C"/>
  <!-- goofy grin with tongue -->
  <path d="M100 188 Q132 212 168 180" fill="none" stroke="#14231C" stroke-width="6" stroke-linecap="round"/>
  <path d="M136 198 Q140 226 154 222 Q164 218 158 190 Z" fill="#FF7A9A" stroke="#14231C" stroke-width="5" stroke-linejoin="round"/>
  <!-- a fly, because of course -->
  <circle cx="220" cy="118" r="5" fill="#14231C"/>
  <ellipse cx="215" cy="111" rx="6" ry="4" fill="#C9D8CF" stroke="#14231C" stroke-width="2"/>
  <ellipse cx="226" cy="111" rx="6" ry="4" fill="#C9D8CF" stroke="#14231C" stroke-width="2"/>
  <path d="M212 126 q-8 8 -2 14 q6 6 -2 12" fill="none" stroke="#14231C" stroke-width="2" stroke-dasharray="3 4"/>
</svg>
